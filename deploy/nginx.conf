# Serves the built PWA (dist/) from an unprivileged nginx on port 8080.
# Copied over the base image's conf.d/default.conf by the Dockerfile.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # add_header is inherited only by locations that set none of their own, so each
    # location repeats what it needs:
    # https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header

    # The page loads only same-origin files: Vite emits no inline script, and the service
    # worker registration ships as /registerSW.js. Widen a directive here when the app
    # starts loading something new (smoke.sh checks the script-src rule).
    # https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    # Entry points revalidate, so an installed copy picks up a new version.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp;
    }
    location ~ ^/(sw|registerSW)\.js$ {
        add_header Cache-Control "no-cache";
    }
    # nginx's mime.types has no .webmanifest entry, so the type is set here.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Vite and Workbox put a content hash in these names, so they never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Catalogue images: the import puts a content hash in each name.
    location ^~ /catalogue/images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icon names carry no hash, so 30 days rather than a year.
    location ~ ^/((pwa|maskable-icon|apple-touch-icon)-[0-9x-]+\.png|favicon\.(ico|svg))$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        return 404;
    }
}
